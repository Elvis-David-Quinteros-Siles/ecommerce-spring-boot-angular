<!-- Header User-->
<app-header-user></app-header-user>

<main class="auth-wrapper">
  <div class="panel panel-body auth-card text-center py-5">

    <ng-container *ngIf="status === 'loading'">
      <div class="spinner-border text-primary mb-3" role="status"></div>
      <h1 class="h4 fw-bold">Confirmando tu pago...</h1>
      <p class="text-muted mb-0">No cierres esta ventana.</p>
    </ng-container>

    <ng-container *ngIf="status === 'ok'">
      <div class="success-icon"><i class="bi bi-check-lg"></i></div>
      <h1 class="h3 fw-bold">¡Pago completado!</h1>
      <p class="text-muted">Gracias por tu compra. Tu pedido <strong *ngIf="orderId">#{{ orderId }}</strong> fue confirmado.</p>
      <a class="btn btn-primary btn-lg mt-2" [routerLink]="['/']"><i class="bi bi-shop me-2"></i>Seguir comprando</a>
    </ng-container>

    <ng-container *ngIf="status === 'error'">
      <div class="auth-icon text-warning" style="background: #fef3c7"><i class="bi bi-exclamation-triangle"></i></div>
      <h1 class="h4 fw-bold">No pudimos confirmar el pedido</h1>
      <p class="text-muted">Si el pago se realizó en PayPal, conserva el comprobante y contáctanos.</p>
      <a class="btn btn-outline-primary mt-2" [routerLink]="['/']">Volver a la tienda</a>
    </ng-container>

  </div>
</main>

<app-footer></app-footer>
