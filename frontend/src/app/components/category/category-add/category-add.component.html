<app-header-admin> </app-header-admin>

<main class="page">
    <div class="container" style="max-width: 640px">

        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a routerLink="/admin/category">Categorías</a></li>
                <li class="breadcrumb-item active" aria-current="page">{{ isEdit ? 'Editar' : 'Nueva' }}</li>
            </ol>
        </nav>

        <div class="page-header">
            <div>
                <h1>{{ isEdit ? 'Editar categoría' : 'Nueva categoría' }}</h1>
                <p>Las categorías agrupan los productos del catálogo.</p>
            </div>
        </div>

        <form #categoryForm="ngForm" (ngSubmit)="addCategory()" novalidate class="panel panel-body">
            <label class="form-label" for="name">Nombre</label>
            <input [(ngModel)]="name" #nameCtrl="ngModel" class="form-control" id="name" name="name"
                placeholder="Ej. Electrónica" autocomplete="off" required minlength="3"
                [class.is-invalid]="nameCtrl.invalid && nameCtrl.touched">
            <div class="invalid-feedback">El nombre debe tener al menos 3 caracteres.</div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a class="btn btn-outline-secondary" routerLink="/admin/category">Cancelar</a>
                <button type="submit" class="btn btn-primary px-4" [disabled]="categoryForm.invalid || saving">
                    <span *ngIf="saving" class="spinner-border spinner-border-sm me-2" role="status"></span>
                    <i *ngIf="!saving" class="bi bi-check-lg me-1"></i>{{ isEdit ? 'Guardar cambios' : 'Crear categoría' }}
                </button>
            </div>
        </form>

    </div>
</main>
