<app-header-admin> </app-header-admin>

<main class="page">
    <div class="container" style="max-width: 860px">

        <div class="page-header">
            <div>
                <h1>Categorías</h1>
                <p>Organiza los productos de la tienda.</p>
            </div>
            <a class="btn btn-primary" routerLink="/admin/category/add"><i class="bi bi-plus-lg me-1"></i>Nueva categoría</a>
        </div>

        <div class="panel">
            <div class="p-5 text-center" *ngIf="loading">
                <div class="spinner-border text-primary" role="status"></div>
            </div>

            <div class="empty-state" *ngIf="!loading && categories.length === 0">
                <i class="bi bi-tags"></i>
                <h2>Aún no hay categorías</h2>
                <p>Crea categorías para clasificar tus productos.</p>
                <a class="btn btn-primary" routerLink="/admin/category/add"><i class="bi bi-plus-lg me-1"></i>Nueva categoría</a>
            </div>

            <div class="table-responsive" *ngIf="!loading && categories.length > 0">
                <table class="table table-modern">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let c of categories">
                            <td>
                                <span class="d-inline-flex align-items-center gap-2">
                                    <span class="auth-icon m-0" style="width: 36px; height: 36px; font-size: 1rem; border-radius: 10px"><i class="bi bi-tag"></i></span>
                                    <span class="fw-semibold">{{ c.name }}</span>
                                </span>
                            </td>
                            <td class="text-end text-nowrap">
                                <button class="btn btn-sm btn-outline-secondary me-1" [routerLink]="['/admin/category/update', c.id]" title="Editar">
                                    <i class="bi bi-pencil"></i><span class="d-none d-sm-inline ms-1">Editar</span>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" (click)="deleteCategoryById(c)" title="Eliminar">
                                    <i class="bi bi-trash3"></i><span class="d-none d-sm-inline ms-1">Eliminar</span>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</main>
