<!-- Header User-->
<app-header-user></app-header-user>

<main class="auth-wrapper">
  <div class="panel auth-card wide">
    <div class="panel-body p-4 p-sm-5">
      <div class="auth-icon"><i class="bi bi-person-plus"></i></div>
      <h1 class="h3 fw-bold text-center mb-1">Crear cuenta</h1>
      <p class="text-muted text-center mb-4">Regístrate para comprar en la tienda</p>

      <form #regForm="ngForm" (ngSubmit)="register()" novalidate>
        <div class="row g-3">
          <div class="col-sm-6">
            <label for="name" class="form-label">Nombre</label>
            <input [(ngModel)]="name" #nameCtrl="ngModel" type="text" class="form-control" id="name" name="name"
              placeholder="Tu nombre" required autocomplete="given-name"
              [class.is-invalid]="nameCtrl.invalid && nameCtrl.touched">
            <div class="invalid-feedback">El nombre es obligatorio.</div>
          </div>

          <div class="col-sm-6">
            <label for="surname" class="form-label">Apellido</label>
            <input [(ngModel)]="surname" #surnameCtrl="ngModel" type="text" class="form-control" id="surname" name="surname"
              placeholder="Tu apellido" required autocomplete="family-name"
              [class.is-invalid]="surnameCtrl.invalid && surnameCtrl.touched">
            <div class="invalid-feedback">El apellido es obligatorio.</div>
          </div>

          <div class="col-12">
            <label for="email" class="form-label">Email</label>
            <input [(ngModel)]="email" #emailCtrl="ngModel" type="email" class="form-control" id="email" name="email"
              placeholder="tucorreo@ejemplo.com" required email autocomplete="email"
              [class.is-invalid]="emailCtrl.invalid && emailCtrl.touched">
            <div class="invalid-feedback">Ingresa un email válido.</div>
          </div>

          <div class="col-sm-8">
            <label for="address" class="form-label">Dirección</label>
            <input [(ngModel)]="address" #addressCtrl="ngModel" type="text" class="form-control" id="address" name="address"
              placeholder="Calle, número, ciudad" required autocomplete="street-address"
              [class.is-invalid]="addressCtrl.invalid && addressCtrl.touched">
            <div class="invalid-feedback">La dirección es obligatoria.</div>
          </div>

          <div class="col-sm-4">
            <label for="cellphone" class="form-label">Teléfono</label>
            <input [(ngModel)]="cellphone" #phoneCtrl="ngModel" type="tel" class="form-control" id="cellphone" name="cellphone"
              placeholder="70000000" required pattern="[0-9+ ()-]{6,20}" autocomplete="tel"
              [class.is-invalid]="phoneCtrl.invalid && phoneCtrl.touched">
            <div class="invalid-feedback">Ingresa un teléfono válido.</div>
          </div>

          <div class="col-12">
            <label for="password" class="form-label">Contraseña</label>
            <div class="input-group has-validation">
              <input [(ngModel)]="password" #pwdCtrl="ngModel" [type]="showPassword ? 'text' : 'password'" class="form-control"
                id="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password"
                [class.is-invalid]="pwdCtrl.invalid && pwdCtrl.touched">
              <button class="btn btn-outline-secondary" type="button" (click)="showPassword = !showPassword"
                [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
                <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
              </button>
              <div class="invalid-feedback">La contraseña debe tener al menos 6 caracteres.</div>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100 mt-4" [disabled]="regForm.invalid || loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
          {{ loading ? 'Creando cuenta...' : 'Crear cuenta' }}
        </button>
      </form>

      <p class="text-center text-muted mt-4 mb-0">
        ¿Ya tienes cuenta? <a [routerLink]="['/user/login']" class="fw-semibold text-decoration-none">Ingresa aquí</a>
      </p>
    </div>
  </div>
</main>

<app-footer></app-footer>
