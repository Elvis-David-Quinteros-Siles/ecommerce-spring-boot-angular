<!-- Header User-->
<app-header-user></app-header-user>

<main class="auth-wrapper">
  <div class="panel auth-card">
    <div class="panel-body p-4 p-sm-5">
      <div class="auth-icon"><i class="bi bi-person-lock"></i></div>
      <h1 class="h3 fw-bold text-center mb-1">Ingresar</h1>
      <p class="text-muted text-center mb-4">Accede a tu cuenta para comprar</p>

      <form #loginForm="ngForm" (ngSubmit)="login()" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input [(ngModel)]="username" #emailCtrl="ngModel" type="email" class="form-control" id="email" name="email"
            placeholder="tucorreo@ejemplo.com" required email autocomplete="email"
            [class.is-invalid]="emailCtrl.invalid && emailCtrl.touched">
          <div class="invalid-feedback">Ingresa un email válido.</div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group has-validation">
            <input [(ngModel)]="password" #pwdCtrl="ngModel" [type]="showPassword ? 'text' : 'password'" class="form-control"
              id="password" name="password" placeholder="Tu contraseña" required autocomplete="current-password"
              [class.is-invalid]="pwdCtrl.invalid && pwdCtrl.touched">
            <button class="btn btn-outline-secondary" type="button" (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
            </button>
            <div class="invalid-feedback">Ingresa tu contraseña.</div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="loginForm.invalid || loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
          {{ loading ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>

      <p class="text-center text-muted mt-4 mb-0">
        ¿Aún no tienes cuenta? <a [routerLink]="['/user/register']" class="fw-semibold text-decoration-none">Regístrate</a>
      </p>
    </div>
  </div>
</main>

<app-footer></app-footer>
