<app-header-admin *ngIf="isAdmin"></app-header-admin>
<app-header-user *ngIf="!isAdmin"></app-header-user>

<main class="auth-wrapper">
  <div class="panel auth-card">
    <div class="panel-body p-4 p-sm-5">
      <div class="auth-icon"><i class="bi bi-key"></i></div>
      <h1 class="h3 fw-bold text-center mb-1">Cambiar contraseña</h1>
      <p class="text-muted text-center mb-4">Por seguridad, ingresa primero tu contraseña actual</p>

      <form #pwdForm="ngForm" (ngSubmit)="changePassword()" novalidate>
        <div class="mb-3">
          <label for="currentPassword" class="form-label">Contraseña actual</label>
          <input [(ngModel)]="currentPassword" #currentCtrl="ngModel" [type]="showPassword ? 'text' : 'password'" class="form-control"
            id="currentPassword" name="currentPassword" required autocomplete="current-password"
            [class.is-invalid]="currentCtrl.invalid && currentCtrl.touched">
          <div class="invalid-feedback">Ingresa tu contraseña actual.</div>
        </div>

        <div class="mb-3">
          <label for="newPassword" class="form-label">Nueva contraseña</label>
          <input [(ngModel)]="newPassword" #newCtrl="ngModel" [type]="showPassword ? 'text' : 'password'" class="form-control"
            id="newPassword" name="newPassword" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password"
            [class.is-invalid]="(newCtrl.invalid && newCtrl.touched) || sameAsCurrent">
          <div class="invalid-feedback">
            {{ sameAsCurrent ? 'La nueva contraseña debe ser distinta de la actual.' : 'La contraseña debe tener al menos 6 caracteres.' }}
          </div>
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirmar nueva contraseña</label>
          <input [(ngModel)]="confirmPassword" #confirmCtrl="ngModel" [type]="showPassword ? 'text' : 'password'" class="form-control"
            id="confirmPassword" name="confirmPassword" placeholder="Repite la nueva contraseña" required autocomplete="new-password"
            [class.is-invalid]="mismatch || (confirmCtrl.invalid && confirmCtrl.touched)">
          <div class="invalid-feedback">Las contraseñas no coinciden.</div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="showPassword" name="showPassword" [(ngModel)]="showPassword">
          <label class="form-check-label small" for="showPassword">Mostrar contraseñas</label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="pwdForm.invalid || mismatch || sameAsCurrent || saving">
          <span *ngIf="saving" class="spinner-border spinner-border-sm me-2" role="status"></span>
          {{ saving ? 'Guardando...' : 'Cambiar contraseña' }}
        </button>
      </form>
    </div>
  </div>
</main>

<app-footer></app-footer>
